        <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">

          <ellipse cx="12" cy="6.2" rx="7.6" ry="3" />

          <path d="M4 14h16" />
          <path d="M4 18.5h16" />

    </svg>

    <div class="app">
      <header class="appbar">
        <div class="brand">
          <span class="brand__mark"><svg class="icon" width="22" height="22"><use href="#i-prism" /></svg></span>
          <span class="brand__text">
            <strong>人格棱镜</strong>
            <small>群友画像 · 恋爱诊断 · 卡片出图 · 记录归档</small>
          </span>
        </div>
        <div class="appbar__actions">
          <div class="themebox">
            <button class="btn btn--ghost" id="theme-toggle" aria-haspopup="true" aria-expanded="false">
              <span class="swatch" id="theme-swatch" aria-hidden="true"></span>
              <span id="theme-label">主题</span>
              <svg class="icon btn__caret" width="14" height="14"><use href="#i-caret" /></svg>
            </button>
            <div class="thememenu" id="theme-menu" hidden></div>
          </div>
          <button class="btn btn--ghost" id="density" title="切换信息密度">
            <svg class="icon" width="16" height="16"><use href="#i-density" /></svg>
            <span id="density-label">舒适</span>
          </button>
          <button class="btn btn--primary" id="refresh">
            <svg class="icon" width="16" height="16"><use href="#i-refresh" /></svg>
            <span>刷新</span>
          </button>
        </div>
      </header>

      <nav class="tabbar" id="nav" aria-label="主导航"></nav>

      <main class="main" id="main"></main>

      <footer class="statusbar">
        <p class="statusbar__run" id="status-run">正在连接控制台…</p>
        <div class="statusbar__crumb">
          <span id="status-crumb"></span>
          <span class="pill pill--muted" id="version-pill">v-</span>
        </div>
      </footer>
    </div>

    <div class="scrim" id="scrim" hidden></div>
    <aside class="drawer" id="drawer" hidden aria-label="详情"></aside>
    <div class="toasts" id="toasts" aria-live="polite"></div>

    <!-- 桥接 SDK 必须先于 app.js 加载：显式声明此路径可让 AstrBot 重写为带令牌的地址，
         同时阻止它把 SDK 自动注入到 </body> 之前（那样会排在 app.js 后面导致取不到桥接）。 -->
    <script src="/api/plugin/page/bridge-sdk.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
