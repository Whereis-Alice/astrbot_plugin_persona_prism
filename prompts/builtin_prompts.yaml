# 人格棱镜内置提示词
#
# 每个条目：
#   command    触发命令（供 WebUI 展示；内置条目的命令在 main.py 里硬编码）
#   label      卡片标题后缀 / 记录里的类型名
#   structured 是否要求模型输出结构化 JSON（clone 例外，输出纯文本人格设定）
#   prompt     任务描述。会被包进统一的骨架提示词里，骨架负责防注入与输出契约。

portrait:
  command: 棱镜画像
  label: 人格画像
  structured: true
  prompt: |
    请基于语料，给出这位群友的人格画像。
    要求：
    - headline 用一句 20 字以内的话概括这个人，要具体、有画面感，不要"活跃开朗的群友"这类套话。
    - tags 给 4 到 6 个标签，每个 2 到 6 字，polarity 按褒/中/贬如实标注，不要一味夸。
    - dimensions 固定给这六个维度，按语料打分（0-100）：外向性、情绪稳定、逻辑性、幽默感、攻击性、社交主动。
      note 一句话说明打分依据，必须指向语料里的具体现象。
    - sections 给 3 段：「说话方式」「关注什么」「在群里的角色」。每段 60 到 120 字。
    - evidence 给 2 到 4 条原话引用，quote 必须是语料里出现过的原句（可截断），reason 说明它支撑了哪个判断。
    - advice 给 1 到 2 条与这个人相处的实用建议。

praise:
  command: 棱镜赞赏
  label: 群友赞赏
  structured: true
  prompt: |
    请基于语料，写一份真诚的赞赏。
    要求：
    - 只夸语料里真实存在的优点，不许编造事迹。找不到的优点就不写。
    - headline 是一句让人会心一笑的褒扬。
    - tags 全部 polarity=positive，4 到 6 个。
    - dimensions 给四个：真诚度、幽默感、热心程度、表达能力。
    - sections 给 2 到 3 段，每段聚焦一个具体优点，并说明是从哪些发言看出来的。
    - evidence 给 2 到 3 条原话。
    - advice 写 1 条"这份优点可以怎么继续发挥"。

roast:
  command: 棱镜锐评
  label: 群友锐评
  structured: true
  prompt: |
    请基于语料，写一份幽默但不伤人的锐评（朋友之间的善意调侃）。
    要求：
    - 只调侃语料里真实出现的行为习惯，比如口头禅、发言时段、复读、爱抬杠。
    - 严禁涉及外貌、性别、地域、疾病、家庭、收入、职业歧视，也不要人身攻击或脏话。
    - headline 是一句锐利但让本人也会笑的吐槽。
    - tags 4 到 6 个，polarity 可为 negative 或 neutral，但用词要俏皮而非恶毒。
    - dimensions 给四个：话密程度、抬杠指数、复读倾向、熬夜程度。
    - sections 给 2 到 3 段，每段一个"槽点"，末尾用一句话把话说回来（点出这其实也挺可爱）。
    - evidence 给 2 到 3 条原话作为"证物"。
    - advice 写 1 条真诚的小建议。

clone:
  command: 棱镜克隆
  label: 人格克隆
  structured: false
  prompt: |
    请把这位群友的说话方式，提炼成一份可以直接给聊天机器人使用的人格设定（System Prompt）。
    输出要求：
    - 直接输出人格设定正文，不要任何解释、标题、代码块或 JSON。
    - 用第二人称"你"来写，开头一句先说明"你是谁"。
    - 覆盖这些方面：语气与句长习惯、高频口头禅与用词（从语料里挑真实的）、
      标点与表情使用习惯、面对提问/被调侃/意见不合时的反应、感兴趣的话题、明确不聊的话题。
    - 用简短的条目式句子，总长度控制在 400 字以内。
    - 只写从语料里能看出来的特征，不要虚构身份、职业、经历。

match:
  command: 棱镜姻缘
  label: 群友姻缘
  structured: true
  prompt: |
    请基于语料里的互动痕迹（@ 了谁、回复了谁、和谁话题重叠），推测这位群友在群里最合得来的人，写成一份轻松的"群内缘分报告"。
    要求：
    - 只使用语料里真实出现过的名字。语料里没有互动对象时，坦率说明"互动痕迹不足"，并把 confidence 压到 0.3 以下。
    - 这是娱乐内容，不要暗示真实恋爱关系，也不要涉及性内容。
    - headline 一句话点出这个人的社交方式。
    - tags 4 到 5 个，描述社交风格（如"接话高手""潜水观察员"）。
    - dimensions 给四个：社交主动、话题契合、回应热情、独处倾向。
    - sections 给 2 到 3 段：「最常互动的人」「聊得来的话题」「相处提示」。
    - evidence 给 2 到 3 条体现互动的原话。
    - advice 给 1 到 2 条破冰建议。
