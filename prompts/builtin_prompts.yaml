# 人格棱镜内置提示词
#
# 每个条目：
#   command    触发命令（供 WebUI 展示；内置条目的命令在 main.py 里硬编码）
#   label      卡片标题后缀 / 记录里的类型名
#   structured 是否要求模型输出结构化 JSON
#   layout     输出布局：card（结构化信息卡）/ markdown（自由排版长图卡）/ text（纯文本直发）
#              省略时按 structured 推导：true -> card，false -> text
#   prompt     任务描述。会被包进统一的骨架提示词里，骨架负责防注入与输出契约。
#
# 「棱镜」系列 = 本插件的结构化卡片玩法；「画像」系列 = 兼容上游 astrbot_plugin_portrayal
# 的长文报告玩法，只是改用本插件的卡片渲染与安全约束。

portrait:
  command: 棱镜画像
  label: 人格画像
  structured: true
  prompt: |
    请基于语料，给出这位群友的人格画像。
    要求：
    - headline 用一句 20 字以内的话概括这个人，要具体、有画面感，不要"活跃开朗的群友"这类套话。
    - tags 给 4 到 6 个标签，每个 2 到 6 字，polarity 按褒/中/贬如实标注，不要一味夸。
    - dimensions 固定给这六个维度，按语料打分（0-100）：外向性、情绪稳定、逻辑性、幽默感、攻击性、社交主动。
      note 一句话说明打分依据，必须指向语料里的具体现象。
    - sections 给 3 段：「说话方式」「关注什么」「在群里的角色」。每段 60 到 120 字。
    - evidence 给 2 到 4 条现场原话，quote 必须是语料里出现过的原句（可截断），reason 说明它支撑了哪个判断，
      并给 title 起一个 4 到 10 字的场景小标题。
    - advice 给 1 到 2 条与这个人相处的实用建议。

praise:
  command: 棱镜赞赏
  label: 群友赞赏
  structured: true
  prompt: |
    请基于语料，写一份真诚的赞赏。
    要求：
    - 只夸语料里真实存在的优点，不许编造事迹。找不到的优点就不写。
    - headline 是一句让人会心一笑的褒扬。
    - tags 全部 polarity=positive，4 到 6 个。
    - dimensions 给四个：真诚度、幽默感、热心程度、表达能力。
    - sections 给 2 到 3 段，每段聚焦一个具体优点，并说明是从哪些发言看出来的。
    - evidence 给 2 到 3 条原话，每条配一个 4 到 10 字的 title（场景小标题）和一句 reason。
    - advice 写 1 条"这份优点可以怎么继续发挥"。

roast:
  command: 棱镜锐评
  label: 群友锐评
  structured: true
  prompt: |
    请基于语料，写一份幽默但不伤人的锐评（朋友之间的善意调侃）。
    要求：
    - 只调侃语料里真实出现的行为习惯，比如口头禅、发言时段、复读、爱抬杠。
    - 严禁涉及外貌、性别、地域、疾病、家庭、收入、职业歧视，也不要人身攻击或脏话。
    - headline 是一句锐利但让本人也会笑的吐槽。
    - tags 4 到 6 个，polarity 可为 negative 或 neutral，但用词要俏皮而非恶毒。
    - dimensions 给四个：话密程度、抬杠指数、复读倾向、熬夜程度。
    - sections 给 2 到 3 段，每段一个"槽点"，末尾用一句话把话说回来（点出这其实也挺可爱）。
    - evidence 给 2 到 3 条原话作为"证物"，每条配一个 4 到 10 字的 title（场景小标题）和一句 reason。
    - advice 写 1 条真诚的小建议。

love:
  command: 恋爱诊断
  label: 恋爱诊断
  structured: true
  layout: card
  prompt: |
    请以「赛博恋爱演化诊断室」主诊医师的口吻，为这位群友出一份诊断判词（娱乐向、毒舌但不伤人）。
    场景设定：四维指标是仪器读数，你是看片子的医生——可以调侃、可以下狠话，但不能改读数。
    要求：
    - 四维分数（纯爱值 S / 存在感 V / 白月光 N / 败犬值 I）与恋爱成分总分 L 已由本地公式算出，
      属于既成事实。你只负责解读，绝对不要重新打分、换算、质疑或在正文里另造一套数字。
    - dimensions 字段留空数组，分数与演化算式由程序填充。
    - headline 一句 25 字以内的判词，贴合公式给出的归类，读起来像恋爱游戏结算画面的评语，
      要有梗、有画面感，不要「社交活跃度较高」这类体检报告腔。
    - tags 给 3 到 5 个 2 到 6 字的标签，polarity 如实标注，分低就别硬夸。
    - sections 给 2 段，标题必须原样使用：
      「判词」（80 到 140 字，先给结论再给理由，理由必须指向行为明细里的具体现象，
        比如冷场破冰、连发刷屏、深夜出没、被回复次数，别泛泛而谈）、
      「行为诊断」（60 到 110 字，判断 TA 属于主动扑、被动收、还是自嗨型，
        并指出投入与回声之间的落差，用一两句人话解释这个落差是怎么形成的）。
      第三段「成分拆解」由程序追加，你不要写。
    - evidence 给 1 到 3 条「呈堂证供」，优先挑能体现互动方式的原话（搭话、接梗、被回复、
      冷场后第一句、深夜发言）。title 起一个 4 到 10 字的场景小标题（如「凌晨两点的独白」），
      reason 一句话说明这句话证明了哪个读数。
    - advice 给 1 到 2 条轻松可执行的小建议，像医嘱一样具体。
    - 严禁涉及真实感情状况、性取向、外貌、性别、地域、疾病、收入，也不要暗示任何真实恋爱关系。
      「恋爱成分」只是对群聊互动热度的戏称，不要当成真的在谈恋爱来写。

clone:
  command: 棱镜克隆
  label: 人格克隆
  structured: false
  prompt: |
    请把这位群友的说话方式，提炼成一份可以直接给聊天机器人使用的人格设定（System Prompt）。
    输出要求：
    - 直接输出人格设定正文，不要任何解释、标题、代码块或 JSON。
    - 用第二人称"你"来写，开头一句先说明"你是谁"。
    - 覆盖这些方面：语气与句长习惯、高频口头禅与用词（从语料里挑真实的）、
      标点与表情使用习惯、面对提问/被调侃/意见不合时的反应、感兴趣的话题、明确不聊的话题。
    - 用简短的条目式句子，总长度控制在 400 字以内。
    - 只写从语料里能看出来的特征，不要虚构身份、职业、经历。

match:
  command: 棱镜姻缘
  label: 群友姻缘
  structured: true
  prompt: |
    这是一份「群内缘分报告」，不是人格画像。全篇只回答一个问题：这个人在群里和谁最搭。
    上面「缘分榜」那一节已经把配对结果算好了 —— 名字和匹配度照抄，不许改、不许添人。
    要求：
    - headline 必须点出榜首那个人的名字，写成两个人的关系速写（例："和艾拉的深夜排错二人组"），
      20 字以内。写成"活跃开朗的群友"这类个人总结算不合格。
    - tags 给 4 到 5 个，全部描述这段关系或两人的搭话方式（例："互相接梗""半夜专属听众"），
      不要写性格标签。
    - dimensions 固定给这四个：搭话主动、回应热度、话题重合、黏着程度。
      note 一句话说明依据，必须指向语料里的具体互动。
    - sections 给 3 段，标题固定为「最佳搭子」「话题交集」「这段关系的样子」。
      第一段整段只写榜首那个人：两人怎么搭上的、谁先开口、聊什么最来劲。每段 60 到 110 字。
    - evidence 给 2 到 3 条真实互动现场，优先挑榜首那个人也在场的那几段；
      quote 必须是语料里出现过的原句，并给 title 起一个 4 到 10 字的场景小标题。
    - advice 给 1 到 2 条建议，要点名说"跟谁怎么继续处"。
    - 这是娱乐内容，不要断言真实恋爱关系，也不要涉及性内容。
    - 缘分榜是空的（一次互动都没数到）时，坦率说明还没看到 TA 和谁对上话，
      confidence 压到 0.3 以下，并且不要凭空指定一个人。

# ---------------------------------------------------------------------------
# 画像系列：兼容上游 astrbot_plugin_portrayal 的长文报告玩法
# ---------------------------------------------------------------------------

legacy_portrait:
  command: 画像
  label: 画像·综合
  structured: false
  layout: markdown
  prompt: |
    请基于语料，写一份优缺点权重均衡的性格画像报告，不刻意褒扬也不刻意贬损。
    内容要求：
    - 「一、性格标签」：给出一组全面的性格标签，优势与缺点都要覆盖，分成「优势」「缺点」两行列出。
    - 「二、性格特征分析」：分「1. 优势分析」「2. 缺点分析」两小节；每一条都必须结合聊天记录里的具体内容，
      并在结论后紧跟一句现场原话。
    - 「三、相处建议」：3 条以内，简短、可执行。
    - 语气中立客观、表述平实，不要夸张修辞和情绪化用词。
    - 缺点只针对语料里真实出现的表达习惯与行为模式；严禁涉及外貌、性别、地域、疾病、家庭、收入、
      职业歧视等敏感评价，也不要人身攻击。

legacy_positive:
  command: 正画像
  label: 画像·优势
  structured: false
  layout: markdown
  prompt: |
    请基于语料，写一份【优势导向】的性格画像报告：只聚焦正向特质，允许适度放大亮点，但每个亮点都必须有语料支撑。
    内容要求：
    - 「一、优势标签」：从性格、情绪模式、思维方式、社交风格四个角度提炼优势标签。
    - 「二、性格优势」「三、相处价值」「四、隐藏闪光点」三节依次展开，每条结论后紧跟一句现场原话。
    - 语气温和真诚、有共鸣，但不要肉麻，也不要空洞的排比句。
    - 找不到依据的优点直接不写，绝对不要编造事迹。

legacy_negative:
  command: 负画像
  label: 画像·缺点
  structured: false
  layout: markdown
  prompt: |
    请基于语料，写一份【缺点导向】的性格画像报告：只聚焦问题面，可以犀利冷静、略带刻薄，
    但每条判断都必须有语料里的具体行为支撑。
    内容要求：
    - 「一、缺点标签」：从情绪稳定性、认知偏差、社交习惯、自我认知四个角度提炼缺点标签。
    - 「二、核心性格缺陷」「三、高频问题模式」「四、对他人的负面影响」三节依次展开，
      每条结论后紧跟一句现场原话。
    - 保持理性审判的口吻，不要变成情绪宣泄或无意义的辱骂。
    - 只评价表达习惯与行为模式；严禁涉及外貌、性别、地域、疾病、家庭、收入、职业、性取向等敏感内容，
      也不要恶意人身攻击。

legacy_clone:
  command: 克隆人格
  label: 画像·人格克隆
  structured: false
  layout: text
  prompt: |
    请把这位群友的人格提炼成一份可以直接用于大模型人格克隆的系统提示词。
    要求：
    - 同时还原优势与缺点，不要只保留讨喜的一面。
    - 覆盖说话风格、情绪模式、价值倾向、社交边界、行为习惯。
    - 必须包含「高频表达特征」：从语料里挑真实存在的口头禅、常用句式、标点与表情习惯。
    - 必须包含「触发条件与反应模式」：被提问、被调侃、意见不合、被忽略时分别会怎么反应。
    - 必须包含「禁止项」：这个人不会说的话、不会聊的话题。
    - 只输出可以直接复制使用的纯文本，不要解释、不要代码块、不要 Markdown 标记。
    - 只写语料里能看出来的特征，不要虚构身份、职业、经历。

legacy_match:
  command: 找对象
  label: 画像·红娘
  structured: false
  layout: markdown
  prompt: |
    请以资深红娘的视角，基于语料给这位群友写一份择偶匹配报告。
    内容要求：
    - 「一、性格画像」：依次给出性别倾向（必须写明推断依据，语料看不出就直接写「无法判断」）、
      核心性格、表达模式、兴趣光谱、价值观倾向、情感需求、沟通雷区。
    - 「二、最佳匹配类型」「三、次优匹配类型」：说明什么样的人和 TA 合得来，以及为什么。
    - 「四、避雷建议」：哪类相处方式容易踩雷。
    - 「五、行动建议」：其中要包含一段可以直接发给潜在对象的介绍语，单独放在引用块里。
    - 这是娱乐内容：不要暗示真实恋爱关系，不涉及性内容，也不要给出年龄、婚恋状况等语料未体现的事实。
